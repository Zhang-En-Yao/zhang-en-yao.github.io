<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travels</title>
<link rel="stylesheet" href="assets/css/core.css">
<link rel="stylesheet" href="assets/css/trip.css">
<link rel="stylesheet" href="assets/css/translate.css">

<header class="site-header">
  <div class="wrap">
    <a class="icon-btn" href="travel.html" aria-label="Back to the map">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
    </a>
    <div class="header-tools">
      <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor" stroke="none"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="wrap trip-layout">
  <article id="trip">
    <div class="empty">
      <div class="empty-header">
        <div class="empty-media"><span class="spinner" aria-hidden="true"></span></div>
        <p class="empty-title">Loading the trip…</p>
        <p class="empty-description">Fetching the markdown source.</p>
      </div>
    </div>
  </article>
  <aside class="sidebar">
    <nav id="toc" class="toc"></nav>
  </aside>
</main>

<script src="assets/js/theme.js"></script>
<script src="assets/js/ui.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<!-- d3-geo reaches into d3-array for its Adder, and says so only by throwing at runtime. -->
<script src="https://cdn.jsdelivr.net/npm/d3-array@3/dist/d3-array.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-geo@3/dist/d3-geo.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script src="assets/js/markdown.js"></script>
<script src="assets/js/trip.js"></script>
<script src="assets/js/translate.js"></script>
